<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Bingos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estética oscura y moderna */
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
        }
        .btn-volver {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .btn-volver:hover {
            background-color: #334155;
        }
        /* Tarjetas de estadísticas */
        .stats-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-card h2 {
            margin: 0;
            font-size: 2.5rem;
            color: #34d399;
        }
        .stat-card p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Tabla de ventas */
        .table-container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #334155;
        }
        th {
            color: #94a3b8;
            font-weight: 600;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #0f172a;
        }
        .estado-select {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        .estado-select:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .estado-select option {
            background-color: #1e293b;
            color: #f1f5f9;
        }
        .estado-pendiente {
            color: #fbbf24;
            font-weight: bold;
            background: rgba(251, 191, 36, 0.1);
            padding: 5px 10px;
            border-radius: 20px;
        }
        .estado-pagado {
            color: #34d399;
            font-weight: bold;
            background: rgba(52, 211, 153, 0.1);
            padding: 5px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Panel de Administración</h1>
        <div style="display:flex; gap:12px; align-items:center;">
            <a href="index.html" class="btn-volver">← Volver al Inicio</a>
            <a href="#" class="btn-volver" id="btn-logout" style="border-color:#f87171; color:#f87171;">Cerrar Sesión</a>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h2 id="total-ventas">0</h2>
            <p>Total Ventas</p>
        </div>
        <div class="stat-card">
            <h2 id="total-pagados" style="color: #34d399;">0</h2>
            <p>Pagados</p>
        </div>
        <div class="stat-card">
            <h2 id="total-pendientes" style="color: #fbbf24;">0</h2>
            <p>Pendientes</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Sorteo</th>
                    <th>Nº Cartón</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-ventas">
                <tr>
                    <td colspan="6" style="text-align:center; color: #94a3b8;">Cargando base de datos...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ========== Auth Guard ==========
    if (sessionStorage.getItem('admin_logueado') !== 'true') {
        window.location.href = 'login.html';
    }

    // ========== Logout ==========
    document.getElementById('btn-logout').addEventListener('click', (e) => {
        e.preventDefault();
        sessionStorage.removeItem('admin_logueado');
        window.location.href = 'login.html';
    });

    // Inicializamos Supabase con tus credenciales
    const SUPABASE_URL = 'https://yahmwegfxskynhxepplk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zVQyIDj8cvXw8b8Aq1uYGw_VIkF8MMW';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cambiarEstado(idVenta, nuevoEstado) {
        try {
            // Actualización optimista visual
            const selectElement = document.querySelector(`select[onchange="cambiarEstado(${idVenta}, this.value)"]`);
            if (selectElement) {
                selectElement.className = `estado-select ${nuevoEstado === 'Pendiente' ? 'estado-pendiente' : 'estado-pagado'}`;
            }

            const { error } = await db
                .from('ventas')
                .update({ estado: nuevoEstado })
                .eq('id_venta', idVenta);

            if (error) throw error;
            
            // Recargar datos y contadores tras éxito
            cargarVentas();
        } catch (error) {
            console.error('Error al actualizar el estado:', error);
            alert('Falló el cambio de estado. Por favor, intentá de nuevo.');
            cargarVentas(); // Revertir visualmente en caso de error
        }
    }

    async function eliminarVenta(idVenta) {
        if (!confirm('¿Seguro que querés eliminar esta venta? El número de cartón volverá a estar disponible.')) return;
        
        try {
            const { error } = await db
                .from('ventas')
                .delete()
                .eq('id_venta', idVenta);

            if (error) throw error;
            
            cargarVentas(); // Recargar tras eliminar
        } catch (error) {
            console.error('Error al eliminar la venta:', error);
            alert('Falló al eliminar. Intentá nuevamente.');
        }
    }

    async function cargarVentas() {
        try {
            // Hacemos un JOIN a las tablas clientes y sorteos para traer los nombres
            const { data: ventas, error } = await db
                .from('ventas')
                .select('id_venta, numero_carton, estado, clientes(nombre), sorteos(nombre_bingo)')
                .order('id_venta', { ascending: false });

            if (error) throw error;

            const tbody = document.getElementById('tabla-ventas');
            tbody.innerHTML = '';

            let contTotal = 0;
            let contPagados = 0;
            let contPendientes = 0;

            if (ventas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: #94a3b8;">Todavía no hay ventas registradas.</td></tr>';
                return;
            }

            // Recorremos las ventas y armamos la tabla
            ventas.forEach(venta => {
                contTotal++;
                if (venta.estado === 'Pagado') contPagados++;
                else contPendientes++;

                // Extraemos los datos del JOIN
                const nombreCliente = venta.clientes ? venta.clientes.nombre : 'Desconocido';
                const nombreSorteo = venta.sorteos ? venta.sorteos.nombre_bingo : 'Desconocido';
                const claseEstado = venta.estado === 'Pendiente' ? 'estado-pendiente' : 'estado-pagado';
                const selectedPendiente = venta.estado === 'Pendiente' ? 'selected' : '';
                const selectedPagado = venta.estado === 'Pagado' ? 'selected' : '';

                tbody.innerHTML += `
                    <tr>
                        <td>#${venta.id_venta}</td>
                        <td>${nombreCliente}</td>
                        <td>${nombreSorteo}</td>
                        <td><strong>${venta.numero_carton}</strong></td>
                        <td>
                            <select class="estado-select ${claseEstado}" onchange="cambiarEstado(${venta.id_venta}, this.value)">
                                <option value="Pendiente" ${selectedPendiente}>Pendiente</option>
                                <option value="Pagado" ${selectedPagado}>Pagado</option>
                            </select>
                        </td>
                        <td>
                            <button onclick="eliminarVenta(${venta.id_venta})" style="background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.2rem; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'" title="Eliminar Venta">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            // Actualizamos los contadores de arriba
            document.getElementById('total-ventas').innerText = contTotal;
            document.getElementById('total-pagados').innerText = contPagados;
            document.getElementById('total-pendientes').innerText = contPendientes;

        } catch (error) {
            console.error('Error al cargar el panel:', error);
            document.getElementById('tabla-ventas').innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ef4444;">Error de conexión. Revisá la consola.</td></tr>`;
        }
    }

    // Ejecutamos la función apenas carga la página
    document.addEventListener('DOMContentLoaded', cargarVentas);
</script>

</body>
</html>
